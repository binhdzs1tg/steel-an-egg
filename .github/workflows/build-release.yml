name: Build Windows EXE on Release

# Tự động kích hoạt khi một bản phát hành được tạo (published)
# Hoặc có thể trigger thủ công qua workflow_dispatch
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag của release để upload EXE lên (phải đã tồn tại)"
        required: true
        type: string

# Quyền cần thiết để upload asset lên release
permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: ubuntu-latest

    env:
      GODOT_VERSION: "4.7.2"
      GODOT_RELEASE: "stable"
      EXPORT_NAME: "SteelAnEgg"
      EXPORT_PRESET: "Windows Desktop"

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Cài đặt dependencies cần thiết để chạy Godot headless
      #   Ubuntu 24.04 đổi tên libasound2 -> libasound2t64, libpulse0 -> libpulse0t64,
      #   nên ta cài với fallback để workflow chạy được trên mọi phiên bản runner.
      - name: Install Linux dependencies for Godot
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget zip libfontconfig1 libfuse2 || true
          # Audio libs có thể đổi tên theo time64 transition
          sudo apt-get install -y libasound2 libpulse0 || \
            sudo apt-get install -y libasound2t64 libpulse0t64 || true
          # X11 / GL libs (không bắt buộc cho headless export nhưng giúp tương thích)
          sudo apt-get install -y \
            libgl1 libglu1-mesa \
            libxrandr2 libxinerama1 libxcursor1 libxi6 || true
          echo "Dependencies install step completed."

      # 3. Tải Godot Engine 4.7.2 Linux headless binary
      - name: Download Godot Engine ${{ env.GODOT_VERSION }}.${{ env.GODOT_RELEASE }}
        run: |
          GODOT_FILENAME="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/${GODOT_FILENAME}.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x "${GODOT_FILENAME}"
          mv "${GODOT_FILENAME}" godot
          ./godot --version

      # 4. Tải và cài đặt export templates
      - name: Download and install export templates
        run: |
          TEMPLATES_FILENAME="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/${TEMPLATES_FILENAME}" -O templates.tpz
          unzip -q templates.tpz
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mv templates/* "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/"
          ls -la "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/"

      # 5. Tạo thư mục export
      - name: Create export directory
        run: mkdir -p export

      # 5b. Generate .godot/ cache trước khi export
      #   Godot 4.x cần .godot/ cache để đăng ký class_name giữa các script.
      #   Nếu không có cache này, các script tham chiếu class_name (như BiomeGate,
      #   Player, NPC, Egg...) sẽ không parse được → EXE build vẫn "thành công"
      #   nhưng crash ngay khi chạy do script rỗng/lỗi.
      - name: Generate .godot cache (import)
        run: |
          ./godot --headless --import 2>&1 | tee import_log.txt || true
          echo "=== Import finished ==="
          ls -la .godot/ 2>/dev/null || echo "WARNING: .godot folder not created"

      # 6. Build Windows EXE
      - name: Export Windows Desktop (EXE)
        run: |
          ./godot --headless --verbose \
            --export-release "${EXPORT_PRESET}" \
            "export/${EXPORT_NAME}.exe" 2>&1 | tee export_log.txt
          echo "=== Export finished ==="
          ls -la export/
          # Fail early nếu EXE quá nhỏ (dưới 10MB = có lẽ template bị thiếu)
          EXE_SIZE=$(stat -c%s "export/${EXPORT_NAME}.exe" 2>/dev/null || echo 0)
          echo "EXE size: ${EXE_SIZE} bytes"
          if [ "${EXE_SIZE}" -lt 10000000 ]; then
            echo "ERROR: EXE too small — export template may be missing or scripts failed to compile"
            exit 1
          fi

      # 7. Đính kèm EXE vào release
      #   - Trigger tự động từ release event: dùng tag từ event payload
      #   - Trigger thủ công workflow_dispatch: dùng tag từ inputs.release_tag
      - name: Upload EXE to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          files: export/${{ env.EXPORT_NAME }}.exe
          fail_on_unmatched_files: true

      # 8. Upload log artifact để debug nếu cần
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            export_log.txt
            import_log.txt
          retention-days: 7
          if-no-files-found: ignore
