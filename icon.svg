<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="eggGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="60%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#F9A825"/>
    </linearGradient>
    <radialGradient id="steelGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E0E0E0"/>
      <stop offset="50%" stop-color="#9E9E9E"/>
      <stop offset="100%" stop-color="#424242"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" fill="#1a1a2e"/>
  <!-- Steel ring -->
  <ellipse cx="64" cy="64" rx="56" ry="60" fill="none" stroke="url(#steelGrad)" stroke-width="6" opacity="0.85"/>
  <!-- Egg -->
  <ellipse cx="64" cy="68" rx="34" ry="44" fill="url(#eggGrad)" stroke="#5D4037" stroke-width="2"/>
  <!-- Egg shine -->
  <ellipse cx="54" cy="50" rx="8" ry="14" fill="#FFFFFF" opacity="0.6"/>
  <!-- Steel crosshair -->
  <line x1="64" y1="18" x2="64" y2="32" stroke="#BDBDBD" stroke-width="3"/>
  <line x1="64" y1="96" x2="64" y2="110" stroke="#BDBDBD" stroke-width="3"/>
  <line x1="18" y1="64" x2="32" y2="64" stroke="#BDBDBD" stroke-width="3"/>
  <line x1="96" y1="64" x2="110" y2="64" stroke="#BDBDBD" stroke-width="3"/>
  <circle cx="64" cy="64" r="4" fill="#F9A825"/>
</svg>
